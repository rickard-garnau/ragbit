[project]
name = "ragbit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rickard Garnau", email = "rickardgarnau@gmail.com" }
]
requires-python = ">=3.13"
dependencies = ["ipykernel", "pypdf"]

[project.scripts]
ragbit = "ragbit:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "backend",
    "frontend",
]
